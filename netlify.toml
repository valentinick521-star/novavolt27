# Redeploy trigger: 2026-08-13 homepage-performance-pass
[build]
command = "npm run build:netlify"
functions = "netlify/functions"
publish = "dist/spa"

[images]
remote_images = ["https:\\/\\/img\\.theepochtimes\\.com\\/.*"]

[functions]
external_node_modules = ["express"]
node_bundler = "esbuild"

[[redirects]]
force = true
from = "/api/*"
status = 200
to = "/.netlify/functions/api/:splat"

# Serve the generated Terms page explicitly before the SPA fallback.
[[redirects]]
force = true
from = "/terms"
status = 200
to = "/terms/index.html"

[[redirects]]
force = true
from = "/terms/"
status = 200
to = "/terms/index.html"

# Keep the older Terms slug working if it is visited directly.
[[redirects]]
force = true
from = "/terms-of-use"
status = 301
to = "/terms/"

[[redirects]]
force = true
from = "/terms-of-use/"
status = 301
to = "/terms/"

# SPA fallback for any route without a prerendered file.
# Prerendered static files (e.g. /privacy-policy/index.html) take precedence.
[[redirects]]
from = "/*"
status = 200
to = "/index.html"

# Hashed, content-addressed assets can be cached forever.
[[headers]]
for = "/assets/*"
[headers.values]
cache-control = "public, max-age=31536000, immutable"