<!doctype html>

  <head>
    <meta charset="UTF-8" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="preconnect" href="https://cdn.builder.io" crossorigin />
    <script data-ncr-font-loader>
      (function () {
        var href = "https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,400;9..40,600;9..40,700;9..40,800&family=Source+Serif+4:opsz,wght@8..60,700;8..60,800&display=swap";
        function loadFonts() {
          if (document.querySelector('link[data-ncr-fonts]')) return;
          var link = document.createElement("link");
          link.rel = "stylesheet";
          link.href = href;
          link.setAttribute("data-ncr-fonts", "true");
          document.head.appendChild(link);
        }
        if ("requestIdleCallback" in window) {
          requestIdleCallback(loadFonts, { timeout: 1400 });
        } else {
          window.addEventListener("load", function () {
            setTimeout(loadFonts, 250);
          }, { once: true });
        }
      })();
    </script>
    <noscript>
      <link
        rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,400;9..40,600;9..40,700;9..40,800&family=Source+Serif+4:opsz,wght@8..60,700;8..60,800&display=swap"

  <body>
    <div id="root"></div>

    <script type="module" src="/client/App.tsx"></script>

    <!-- Affiliate campaign metadata -->
    <script>
      (function () {
        function clean(value) {
          return (value || "").trim().replace(/\+$/g, "");
        }

        function getTrackingData() {
          const pageParams = new URLSearchParams(window.location.search);

          const keyword =
            clean(pageParams.get("sub4")) ||
            clean(pageParams.get("utm_term"));

          const campaignId = clean(pageParams.get("utm_campaign"));
          const adgroupId = clean(pageParams.get("adgroupid"));

          return {
            source_id: "google",
            sub1: campaignId, // Campaign ID
            sub3: adgroupId, // Ad Group ID
            sub4: keyword, // Keyword
            sub5: "adv_compare_effort_gap_v1", // Prelander / angle label
          };
        }

        function appendTrackingToLink(link) {
          try {
            const trackingData = getTrackingData();
            const url = new URL(link.href);

            Object.keys(trackingData).forEach(function (key) {
              if (trackingData[key]) {
                url.searchParams.set(key, trackingData[key]);
              }
            });

            link.href = url.toString();
          } catch (error) {
            console.log("Tracking append error:", error);
          }
        }

        document.addEventListener(
          "click",
          function (event) {
            const link = event.target.closest
              ? event.target.closest('a[href*="unbindgear.com/novavoltsolar"]')
              : null;

            if (link) {
              appendTrackingToLink(link);
            }
          },
          true,
        );

        document.addEventListener(
          "auxclick",
          function (event) {
            const link = event.target.closest
              ? event.target.closest('a[href*="unbindgear.com/novavoltsolar"]')
              : null;

            if (link) {
              appendTrackingToLink(link);
            }
          },
          true,
        );
      })();
    </script>
  </body>
